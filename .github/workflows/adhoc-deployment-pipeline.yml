name: Ad-hoc Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        type: choice
        options:
          - INTERFACE-INTERFACES
          - SITE-SITE
      source_environment:
        description: 'Source Environment'
        required: true
        type: choice
        options:
          - TST2
          - TST1
          - TST3
          - PROD
      source_interface:
        description: 'Source Interface'
        required: true
        type: choice
        options:
          - bissell
          - bissell_au
          - bissell_de
          - bissell_es
          - bissell_fr
          - bissell_it
          - bissell_nl
          - bissell_pl
          - bissell_pt
          - bissell_se
          - bissell_uk
          - interface_12
      target_environment:
        description: 'Target Environment (for SITE-SITE select different environment than source)'
        required: true
        type: choice
        options:
          - TST2
          - TST1
          - TST3
          - PROD
      target_interfaces:
        description: 'Target Interface(s) - comma-separated (e.g. bissell_au,bissell_uk) - for INTERFACE-INTERFACES mode'
        required: false
        type: string
      element_type:
        description: 'Element Type'
        required: true
        type: choice
        options:
          - workspaces
          - reports
          - navigation_sets
          - agent_scripts
          - standard_text
          - ebr
          - extensions
          - scripts
          - process_models
          - cp_files
      element_identifier:
        description: 'Element Name, ID, or keyword to search (leave blank to use date range)'
        required: false
        type: string
      from_date:
        description: 'From Date - find elements modified after this date (YYYY-MM-DD format)'
        required: false
        type: string
      to_date:
        description: 'To Date - find elements modified before this date (YYYY-MM-DD format)'
        required: false
        type: string
      checkin_story:
        description: 'Check-in migrated elements to a story branch? (optional)'
        required: false
        type: boolean
        default: false
      story_number:
        description: 'Story Number for check-in (required if Check-in Story is true)'
        required: false
        type: string

jobs:
  # -------------------------------------------------------
  # Job 1 - Validate Inputs
  # -------------------------------------------------------
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest

    outputs:
      source_url: ${{ steps.set_urls.outputs.source_url }}
      target_url: ${{ steps.set_urls.outputs.target_url }}
      build_mode: ${{ github.event.inputs.build_mode }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode }}"
          SOURCE_ENV="${{ github.event.inputs.source_environment }}"
          TARGET_ENV="${{ github.event.inputs.target_environment }}"
          TARGET_INTERFACES="${{ github.event.inputs.target_interfaces }}"
          ELEMENT_ID="${{ github.event.inputs.element_identifier }}"
          FROM_DATE="${{ github.event.inputs.from_date }}"
          STORY_NUMBER="${{ github.event.inputs.story_number }}"
          CHECKIN_STORY="${{ github.event.inputs.checkin_story }}"

          echo "=========================================="
          echo "Ad-hoc Deployment Pipeline Starting"
          echo "=========================================="
          echo "Build Mode         : $BUILD_MODE"
          echo "Source Environment : $SOURCE_ENV"
          echo "Source Interface   : ${{ github.event.inputs.source_interface }}"
          echo "Target Environment : $TARGET_ENV"
          echo "Element Type       : ${{ github.event.inputs.element_type }}"
          echo "=========================================="

          # Validate INTERFACE-INTERFACES mode
          if [ "$BUILD_MODE" == "INTERFACE-INTERFACES" ]; then
            if [ -z "$TARGET_INTERFACES" ]; then
              echo "ERROR: Target interfaces are required for INTERFACE-INTERFACES mode."
              exit 1
            fi
            if [ "$SOURCE_ENV" != "$TARGET_ENV" ]; then
              echo "ERROR: Source and target environments must be the same for INTERFACE-INTERFACES mode."
              exit 1
            fi
          fi

          # Validate SITE-SITE mode
          if [ "$BUILD_MODE" == "SITE-SITE" ]; then
            if [ "$SOURCE_ENV" == "$TARGET_ENV" ]; then
              echo "ERROR: Source and target environments must be different for SITE-SITE mode."
              exit 1
            fi
          fi

          # Validate element identification
          if [ -z "$ELEMENT_ID" ] && [ -z "$FROM_DATE" ]; then
            echo "ERROR: Either element identifier or from/to date range is required."
            exit 1
          fi

          # Validate story number if check-in is requested
          if [ "$CHECKIN_STORY" == "true" ] && [ -z "$STORY_NUMBER" ]; then
            echo "ERROR: Story number is required when check-in story is enabled."
            exit 1
          fi

          if [ -n "$STORY_NUMBER" ] && [[ ! "$STORY_NUMBER" =~ ^ADO-[0-9]+$ ]]; then
            echo "ERROR: Story number must be in format ADO-XXXX (e.g. ADO-5542)"
            exit 1
          fi

          echo "Validation passed."

      - name: Set Environment URLs
        id: set_urls
        run: |
          SOURCE="${{ github.event.inputs.source_environment }}"
          TARGET="${{ github.event.inputs.target_environment }}"

          case "$SOURCE" in
            TST2) echo "source_url=bissell--tst2.custhelp.com" >> $GITHUB_OUTPUT ;;
            TST1) echo "source_url=bissell--tst1.custhelp.com" >> $GITHUB_OUTPUT ;;
            TST3) echo "source_url=bissell--tst3.custhelp.com" >> $GITHUB_OUTPUT ;;
            PROD) echo "source_url=support.bissell.com" >> $GITHUB_OUTPUT ;;
          esac

          case "$TARGET" in
            TST2) echo "target_url=bissell--tst2.custhelp.com" >> $GITHUB_OUTPUT ;;
            TST1) echo "target_url=bissell--tst1.custhelp.com" >> $GITHUB_OUTPUT ;;
            TST3) echo "target_url=bissell--tst3.custhelp.com" >> $GITHUB_OUTPUT ;;
            PROD) echo "target_url=support.bissell.com" >> $GITHUB_OUTPUT ;;
          esac

  # -------------------------------------------------------
  # Job 2 - Export from Source
  # -------------------------------------------------------
  export_source:
    name: Export from Source
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.source_environment }}

    env:
      SOURCE_URL: ${{ needs.validate.outputs.source_url }}

    outputs:
      elements_found: ${{ steps.find_elements.outputs.elements_found }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Basic Auth Header
        run: |
          echo "Setting up Basic Auth..."

          BASIC_AUTH=$(echo -n "${{ secrets.B2C_SITE_LOGIN_USER }}:${{ secrets.B2C_SITE_LOGIN_PASS }}" | base64 -w 0)

          echo "::add-mask::$BASIC_AUTH"
          echo "BASIC_AUTH=$BASIC_AUTH" >> $GITHUB_ENV
          echo "Basic Auth configured."

      - name: Find and Export Elements
        id: find_elements
        run: |
          ELEMENT_TYPE="${{ github.event.inputs.element_type }}"
          ELEMENT_ID="${{ github.event.inputs.element_identifier }}"
          FROM_DATE="${{ github.event.inputs.from_date }}"
          TO_DATE="${{ github.event.inputs.to_date }}"
          SOURCE_INTERFACE="${{ github.event.inputs.source_interface }}"

          EXPORT_DIR="export_staging/$SOURCE_INTERFACE/$ELEMENT_TYPE"
          mkdir -p "$EXPORT_DIR"

          # Map element type to EM API endpoint
          case "$ELEMENT_TYPE" in
            workspaces)       EM_TYPE="workspaces" ;;
            reports)          EM_TYPE="reports" ;;
            navigation_sets)  EM_TYPE="navigationSets" ;;
            agent_scripts)    EM_TYPE="agentScripts" ;;
            standard_text)    EM_TYPE="standardText" ;;
            ebr)              EM_TYPE="exceptionBasedReporting" ;;
            extensions)       EM_TYPE="extensions" ;;
            scripts)          EM_TYPE="scripts" ;;
            process_models)   EM_TYPE="processModels" ;;
          esac

          if [ "$ELEMENT_TYPE" == "cp_files" ]; then
            echo "Exporting CP file(s) via WebDAV..."

            if [ -n "$ELEMENT_ID" ]; then
              FILENAME=$(basename "$ELEMENT_ID")
              curl -s \
                -u "${{ secrets.B2C_CP_LOGIN_USER }}:${{ secrets.B2C_CP_LOGIN_PASS }}" \
                "https://$SOURCE_URL/$ELEMENT_ID" \
                -o "$EXPORT_DIR/$FILENAME"
              echo "CP file exported: $FILENAME"
            fi
          else
            echo "Exporting element(s) via Element Manager API..."

            if [ -n "$ELEMENT_ID" ]; then
              # Export by ID or name
              EXPORT_RESPONSE=$(curl -s -X GET \
                "https://$SOURCE_URL/services/rest/connect/v1.4/elementManager/$EM_TYPE?q=name='$ELEMENT_ID'" \
                -H "Authorization: Basic $BASIC_AUTH" \
                -H "OSvC-CREST-Application-Context: cicd-pipeline")

              echo "$EXPORT_RESPONSE" > "$EXPORT_DIR/${ELEMENT_ID}.json"
              echo "Element exported: $ELEMENT_ID"
            elif [ -n "$FROM_DATE" ]; then
              # Export by date range
              DATE_FILTER="updatedTime>'$FROM_DATE'"
              if [ -n "$TO_DATE" ]; then
                DATE_FILTER="$DATE_FILTER and updatedTime<'$TO_DATE'"
              fi

              EXPORT_RESPONSE=$(curl -s -X GET \
                "https://$SOURCE_URL/services/rest/connect/v1.4/elementManager/$EM_TYPE?q=$DATE_FILTER" \
                -H "Authorization: Basic $BASIC_AUTH" \
                -H "OSvC-CREST-Application-Context: cicd-pipeline")

              echo "$EXPORT_RESPONSE" > "$EXPORT_DIR/date_range_export.json"
              echo "Elements exported by date range: $FROM_DATE to $TO_DATE"
            fi
          fi

          # Check if anything was exported
          EXPORTED_FILES=$(find "$EXPORT_DIR" -type f | wc -l)
          if [ "$EXPORTED_FILES" -eq 0 ]; then
            echo "ERROR: No elements found matching the criteria."
            echo "elements_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "elements_found=true" >> $GITHUB_OUTPUT
          echo "Total elements exported: $EXPORTED_FILES"

      - name: Upload Export Staging as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: export-staging-${{ github.run_number }}
          path: export_staging/
          retention-days: 1

  # -------------------------------------------------------
  # Job 3 - View Diff
  # -------------------------------------------------------
  view_diff:
    name: View Diff
    runs-on: ubuntu-latest
    needs: [validate, export_source]
    environment: ${{ github.event.inputs.target_environment }}

    env:
      TARGET_URL: ${{ needs.validate.outputs.target_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Export Staging
        uses: actions/download-artifact@v4
        with:
          name: export-staging-${{ github.run_number }}
          path: export_staging/

      - name: Authenticate with Target B2C
        run: |
          AUTH_RESPONSE=$(curl -s -X POST \
            "https://$TARGET_URL/services/rest/connect/v1.4/sessions" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"${{ secrets.B2C_SITE_LOGIN_USER }}\",
              \"password\": \"${{ secrets.B2C_SITE_LOGIN_PASS }}\"
            }")

          TARGET_TOKEN=$(echo "$AUTH_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('token', ''))
          ")

          if [ -z "$TARGET_TOKEN" ]; then
            echo "ERROR: Target authentication failed."
            exit 1
          fi

          echo "::add-mask::$TARGET_TOKEN"
          echo "TARGET_TOKEN=$TARGET_TOKEN" >> $GITHUB_ENV

      - name: Generate Diff Report
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode }}"
          ELEMENT_TYPE="${{ github.event.inputs.element_type }}"
          TARGET_INTERFACES="${{ github.event.inputs.target_interfaces }}"
          SOURCE_INTERFACE="${{ github.event.inputs.source_interface }}"

          DIFF_CONTENT="<html><head><title>Ad-hoc Diff Report</title>"
          DIFF_CONTENT+="<style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            h1 { color: #333; }
            h2 { color: #666; border-bottom: 1px solid #ccc; }
            h3 { color: #999; }
            .added { background-color: #e6ffed; }
            .removed { background-color: #ffeef0; }
            pre { background: #f6f8fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
            .summary { background: #f1f8ff; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
          </style></head><body>"

          DIFF_CONTENT+="<h1>Ad-hoc Deployment Diff Report</h1>"
          DIFF_CONTENT+="<div class='summary'>"
          DIFF_CONTENT+="<p><strong>Build Mode:</strong> $BUILD_MODE</p>"
          DIFF_CONTENT+="<p><strong>Source:</strong> ${{ github.event.inputs.source_environment }} / $SOURCE_INTERFACE</p>"
          DIFF_CONTENT+="<p><strong>Target:</strong> ${{ github.event.inputs.target_environment }}</p>"
          DIFF_CONTENT+="<p><strong>Element Type:</strong> $ELEMENT_TYPE</p>"
          DIFF_CONTENT+="<p><strong>Generated:</strong> $(date -u)</p>"
          DIFF_CONTENT+="</div>"

          # List all exported files
          DIFF_CONTENT+="<h2>Elements to be Deployed</h2><ul>"
          for FILE in export_staging/$SOURCE_INTERFACE/$ELEMENT_TYPE/*; do
            [ -f "$FILE" ] || continue
            DIFF_CONTENT+="<li>$(basename $FILE)</li>"
          done
          DIFF_CONTENT+="</ul>"
          DIFF_CONTENT+="</body></html>"

          echo "$DIFF_CONTENT" > diff_report.html

      - name: Upload Diff Report
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-diff-report-${{ github.run_number }}
          path: diff_report.html
          retention-days: 7

      - name: Diff Report Instructions
        run: |
          echo "=========================================="
          echo "DIFF REPORT READY FOR REVIEW"
          echo "=========================================="
          echo "Download from:"
          echo "Actions > This Run > Artifacts > adhoc-diff-report-${{ github.run_number }}"
          echo "Review before proceeding."
          echo "=========================================="

  # -------------------------------------------------------
  # Job 4 - Deploy to Target
  # -------------------------------------------------------
  deploy:
    name: Deploy to Target
    runs-on: ubuntu-latest
    needs: [validate, view_diff]
    environment: ${{ github.event.inputs.target_environment }}

    env:
      SOURCE_URL: ${{ needs.validate.outputs.source_url }}
      TARGET_URL: ${{ needs.validate.outputs.target_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Export Staging
        uses: actions/download-artifact@v4
        with:
          name: export-staging-${{ github.run_number }}
          path: export_staging/

      - name: Set Basic Auth Header
        run: |
          echo "Setting up Basic Auth..."

          BASIC_AUTH=$(echo -n "${{ secrets.B2C_SITE_LOGIN_USER }}:${{ secrets.B2C_SITE_LOGIN_PASS }}" | base64 -w 0)

          echo "::add-mask::$BASIC_AUTH"
          echo "BASIC_AUTH=$BASIC_AUTH" >> $GITHUB_ENV
          echo "Basic Auth configured."

      - name: Deploy Elements to Target Interface(s)
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode }}"
          ELEMENT_TYPE="${{ github.event.inputs.element_type }}"
          SOURCE_INTERFACE="${{ github.event.inputs.source_interface }}"
          TARGET_INTERFACES="${{ github.event.inputs.target_interfaces }}"

          # Determine target interface list
          if [ "$BUILD_MODE" == "SITE-SITE" ]; then
            INTERFACE_LIST="$SOURCE_INTERFACE"
          else
            INTERFACE_LIST="$TARGET_INTERFACES"
          fi

          # Map element type to EM API endpoint
          case "$ELEMENT_TYPE" in
            workspaces)       EM_TYPE="workspaces" ;;
            reports)          EM_TYPE="reports" ;;
            navigation_sets)  EM_TYPE="navigationSets" ;;
            agent_scripts)    EM_TYPE="agentScripts" ;;
            standard_text)    EM_TYPE="standardText" ;;
            ebr)              EM_TYPE="exceptionBasedReporting" ;;
            extensions)       EM_TYPE="extensions" ;;
            scripts)          EM_TYPE="scripts" ;;
            process_models)   EM_TYPE="processModels" ;;
          esac

          IFS=',' read -ra INTERFACES <<< "$INTERFACE_LIST"

          for TARGET_INTERFACE in "${INTERFACES[@]}"; do
            TARGET_INTERFACE=$(echo "$TARGET_INTERFACE" | tr -d ' ')
            echo "----------------------------------------"
            echo "Deploying to interface: $TARGET_INTERFACE"
            echo "----------------------------------------"

            for FILE in export_staging/$SOURCE_INTERFACE/$ELEMENT_TYPE/*; do
              [ -f "$FILE" ] || continue
              FILENAME=$(basename "$FILE")

              if [ "$ELEMENT_TYPE" == "cp_files" ]; then
                echo "  Deploying CP file: $FILENAME via WebDAV..."
                curl -s -T "$FILE" \
                  -u "${{ secrets.B2C_CP_LOGIN_USER }}:${{ secrets.B2C_CP_LOGIN_PASS }}" \
                  "https://$TARGET_URL/dav/cp/customer/development/controllers/$FILENAME" || {
                    echo "  ERROR: Failed to deploy CP file $FILENAME"
                    exit 1
                  }
              else
                echo "  Deploying $ELEMENT_TYPE: $FILENAME via Element Manager API..."
                curl -s -X POST \
                  "https://$TARGET_URL/services/rest/connect/v1.4/elementManager/$EM_TYPE" \
                  -H "Authorization: Session $TARGET_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @"$FILE" || {
                    echo "  ERROR: Failed to deploy $FILENAME"
                    exit 1
                  }
              fi

              echo "  Successfully deployed: $FILENAME to $TARGET_INTERFACE"
            done
          done

          echo "All elements deployed successfully."

      - name: Check-In to Story Branch (if requested)
        if: ${{ github.event.inputs.checkin_story == 'true' }}
        run: |
          STORY_NUMBER="${{ github.event.inputs.story_number }}"
          BRANCH_NAME="story-$STORY_NUMBER"
          SOURCE_INTERFACE="${{ github.event.inputs.source_interface }}"
          ELEMENT_TYPE="${{ github.event.inputs.element_type }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or checkout story branch
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

          # Copy exported elements to customisations folder
          DEST_DIR="customisations/$SOURCE_INTERFACE/$ELEMENT_TYPE"
          mkdir -p "$DEST_DIR"
          cp export_staging/$SOURCE_INTERFACE/$ELEMENT_TYPE/* "$DEST_DIR/" 2>/dev/null || true

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$STORY_NUMBER: Ad-hoc deployment of $ELEMENT_TYPE from ${{ github.event.inputs.source_environment }} [${{ github.event.inputs.build_mode }}]"
            git push origin "$BRANCH_NAME"
            echo "Changes committed to $BRANCH_NAME"
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Ad-hoc Deployment Complete!"
          echo "Build Mode  : ${{ github.event.inputs.build_mode }}"
          echo "Source      : ${{ github.event.inputs.source_environment }} / ${{ github.event.inputs.source_interface }}"
          echo "Target      : ${{ github.event.inputs.target_environment }}"
          echo "Element     : ${{ github.event.inputs.element_type }} / ${{ github.event.inputs.element_identifier }}"
          echo "Timestamp   : $(date -u)"
          echo "=========================================="

  # -------------------------------------------------------
  # Job 5 - Rollback (runs only if deploy fails)
  # -------------------------------------------------------
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: Notify Rollback Required
        run: |
          echo "=========================================="
          echo "WARNING: Ad-hoc deployment failed!"
          echo "Build Mode  : ${{ github.event.inputs.build_mode }}"
          echo "Source      : ${{ github.event.inputs.source_environment }}"
          echo "Target      : ${{ github.event.inputs.target_environment }}"
          echo ""
          echo "Please review the deployment logs above."
          echo "Manual intervention may be required."
          echo "=========================================="