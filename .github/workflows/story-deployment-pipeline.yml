name: Story Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: 'Source Environment'
        required: true
        type: choice
        options:
          - TST2
          - TST1
          - TST3
          - PROD
      target_environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - TST1
          - TST2
          - TST3
          - PROD
      story_list:
        description: 'Story Numbers to Deploy (comma-separated e.g. ADO-5542,ADO-5601 - leave blank to use deploymentConfig.json)'
        required: false
        type: string
      deploy_cp_bissell:
        description: 'Deploy CP files for bissell interface?'
        required: true
        type: boolean
        default: false
      deploy_cp_bissell_uk:
        description: 'Deploy CP files for bissell_uk interface?'
        required: true
        type: boolean
        default: false
      deploy_cp_bissell_de:
        description: 'Deploy CP files for bissell_de interface?'
        required: true
        type: boolean
        default: false
      skip_diff_review:
        description: 'Skip Diff Review Step? (not recommended for PROD)'
        required: true
        type: boolean
        default: false

jobs:
  # -------------------------------------------------------
  # Job 1 - Validate and Prepare
  # -------------------------------------------------------
  validate:
    name: Validate and Prepare
    runs-on: ubuntu-latest

    outputs:
      source_branch: ${{ steps.set_branches.outputs.source_branch }}
      target_branch: ${{ steps.set_branches.outputs.target_branch }}
      target_url: ${{ steps.set_branches.outputs.target_url }}
      target_uk_url: ${{ steps.set_branches.outputs.target_uk_url }}
      target_de_url: ${{ steps.set_branches.outputs.target_de_url }}
      story_list: ${{ steps.set_stories.outputs.story_list }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Environment Combination
        run: |
          SOURCE="${{ github.event.inputs.source_environment }}"
          TARGET="${{ github.event.inputs.target_environment }}"

          echo "=========================================="
          echo "Story Deployment Pipeline Starting"
          echo "=========================================="
          echo "Source : $SOURCE"
          echo "Target : $TARGET"
          echo "Deploy CP bissell    : ${{ github.event.inputs.deploy_cp_bissell }}"
          echo "Deploy CP bissell_uk : ${{ github.event.inputs.deploy_cp_bissell_uk }}"
          echo "Deploy CP bissell_de : ${{ github.event.inputs.deploy_cp_bissell_de }}"
          echo "=========================================="

          if [ "$SOURCE" == "$TARGET" ]; then
            echo "ERROR: Source and target environments cannot be the same."
            exit 1
          fi

          echo "Validation passed."

      - name: Set Branch and URL Values
        id: set_branches
        run: |
          SOURCE="${{ github.event.inputs.source_environment }}"
          TARGET="${{ github.event.inputs.target_environment }}"

          case "$SOURCE" in
            TST2) echo "source_branch=tst2" >> $GITHUB_OUTPUT ;;
            TST1) echo "source_branch=tst1" >> $GITHUB_OUTPUT ;;
            TST3) echo "source_branch=tst3" >> $GITHUB_OUTPUT ;;
            PROD) echo "source_branch=main" >> $GITHUB_OUTPUT ;;
          esac

          case "$TARGET" in
            TST1)
              echo "target_branch=tst1" >> $GITHUB_OUTPUT
              echo "target_url=bissell--tst1.custhelp.com" >> $GITHUB_OUTPUT
              echo "target_uk_url=bissell-uk--tst1.custhelp.com" >> $GITHUB_OUTPUT
              echo "target_de_url=bissell-de--tst1.custhelp.com" >> $GITHUB_OUTPUT
              ;;
            TST2)
              echo "target_branch=tst2" >> $GITHUB_OUTPUT
              echo "target_url=bissell--tst2.custhelp.com" >> $GITHUB_OUTPUT
              echo "target_uk_url=bissell-uk--tst2.custhelp.com" >> $GITHUB_OUTPUT
              echo "target_de_url=bissell-de--tst2.custhelp.com" >> $GITHUB_OUTPUT
              ;;
            TST3)
              echo "target_branch=tst3" >> $GITHUB_OUTPUT
              echo "target_url=bissell--tst3.custhelp.com" >> $GITHUB_OUTPUT
              echo "target_uk_url=bissell-uk--tst3.custhelp.com" >> $GITHUB_OUTPUT
              echo "target_de_url=bissell-de--tst3.custhelp.com" >> $GITHUB_OUTPUT
              ;;
            PROD)
              echo "target_branch=main" >> $GITHUB_OUTPUT
              echo "target_url=support.bissell.com" >> $GITHUB_OUTPUT
              echo "target_uk_url=support.bissell.co.uk" >> $GITHUB_OUTPUT
              echo "target_de_url=support.bissell.de" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Resolve Story List
        id: set_stories
        run: |
          INPUT_STORIES="${{ github.event.inputs.story_list }}"
          TARGET="${{ github.event.inputs.target_environment }}"

          if [ -n "$INPUT_STORIES" ]; then
            echo "Using provided story list: $INPUT_STORIES"
            echo "story_list=$INPUT_STORIES" >> $GITHUB_OUTPUT
          else
            echo "No stories provided - reading from deploymentConfig.json..."
            STORIES=$(python3 -c "
          import json
          with open('deploymentConfig.json') as f:
            config = json.load(f)
          stories = config['environments'].get('$TARGET', {}).get('stories', [])
          print(','.join(stories))
            ")
            if [ -z "$STORIES" ]; then
              echo "ERROR: No stories found in deploymentConfig.json for $TARGET"
              exit 1
            fi
            echo "Stories from config: $STORIES"
            echo "story_list=$STORIES" >> $GITHUB_OUTPUT
          fi

  # -------------------------------------------------------
  # Job 2 - Generate Diff Report
  # -------------------------------------------------------
  diff_review:
    name: Generate Diff Report
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.source_environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Diff Report
        run: |
          SOURCE_BRANCH="${{ needs.validate.outputs.source_branch }}"
          TARGET_BRANCH="${{ needs.validate.outputs.target_branch }}"
          STORIES="${{ needs.validate.outputs.story_list }}"

          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"

          DIFF_CONTENT="<html><head><title>Diff Report</title>"
          DIFF_CONTENT+="<style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            h1 { color: #333; }
            h2 { color: #666; border-bottom: 1px solid #ccc; }
            h3 { color: #999; }
            pre { background: #f6f8fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
            .summary { background: #f1f8ff; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
            .added { color: green; }
            .removed { color: red; }
            .modified { color: orange; }
          </style></head><body>"

          DIFF_CONTENT+="<h1>Deployment Diff Report</h1>"
          DIFF_CONTENT+="<div class='summary'>"
          DIFF_CONTENT+="<p><strong>Source:</strong> $SOURCE_BRANCH (${{ github.event.inputs.source_environment }})</p>"
          DIFF_CONTENT+="<p><strong>Target:</strong> $TARGET_BRANCH (${{ github.event.inputs.target_environment }})</p>"
          DIFF_CONTENT+="<p><strong>Stories:</strong> $STORIES</p>"
          DIFF_CONTENT+="<p><strong>Generated:</strong> $(date -u)</p>"
          DIFF_CONTENT+="</div>"

          # CP Files diff
          DIFF_CONTENT+="<h2>CP File Changes</h2>"
          for INTERFACE in bissell bissell_uk bissell_de; do
            CP_DIR="customisations/$INTERFACE/cp_files"
            CHANGED=$(git diff --name-status "origin/$TARGET_BRANCH" "origin/$SOURCE_BRANCH" -- "$CP_DIR" 2>/dev/null || echo "")

            if [ -n "$CHANGED" ]; then
              DIFF_CONTENT+="<h3>$INTERFACE</h3><pre>"
              while IFS= read -r LINE; do
                STATUS=$(echo "$LINE" | cut -f1)
                FILE=$(echo "$LINE" | cut -f2)
                case "$STATUS" in
                  A) DIFF_CONTENT+="<span class='added'>ADDED: $FILE</span>\n" ;;
                  D) DIFF_CONTENT+="<span class='removed'>DELETED: $FILE</span>\n" ;;
                  M) DIFF_CONTENT+="<span class='modified'>MODIFIED: $FILE</span>\n" ;;
                esac
              done <<< "$CHANGED"
              DIFF_CONTENT+="</pre>"
            else
              DIFF_CONTENT+="<h3>$INTERFACE</h3><p>No CP file changes detected.</p>"
            fi
          done

          # Coded Elements diff
          DIFF_CONTENT+="<h2>Coded Element Changes</h2>"
          for ELEMENT_DIR in extensions scripts process_models; do
            CHANGED=$(git diff --name-status "origin/$TARGET_BRANCH" "origin/$SOURCE_BRANCH" -- "customisations/*/$ELEMENT_DIR" 2>/dev/null || echo "")
            if [ -n "$CHANGED" ]; then
              DIFF_CONTENT+="<h3>$ELEMENT_DIR</h3><pre>$CHANGED</pre>"
              DIFF_CONTENT+="<p><em>Note: These must be deployed manually through B2C.</em></p>"
            fi
          done

          DIFF_CONTENT+="</body></html>"
          echo "$DIFF_CONTENT" > diff_report.html
          echo "Diff report generated."

      - name: Upload Diff Report
        uses: actions/upload-artifact@v4
        with:
          name: diff-report-${{ github.run_number }}
          path: diff_report.html
          retention-days: 7

      - name: Diff Report Instructions
        run: |
          echo "=========================================="
          echo "DIFF REPORT READY FOR REVIEW"
          echo "=========================================="
          echo "Download from:"
          echo "Actions > This Run > Artifacts > diff-report-${{ github.run_number }}"
          echo "Review all changes before proceeding."
          echo "=========================================="

  # -------------------------------------------------------
  # Job 3 - Manual Approval Gate
  # -------------------------------------------------------
  approval:
    name: Awaiting Deployment Approval
    runs-on: ubuntu-latest
    needs: diff_review
    environment: ${{ github.event.inputs.target_environment }}
    if: ${{ github.event.inputs.skip_diff_review != 'true' }}

    steps:
      - name: Approval Gate
        run: |
          echo "=========================================="
          echo "DEPLOYMENT APPROVED"
          echo "Proceeding to deploy to ${{ github.event.inputs.target_environment }}..."
          echo "=========================================="

  # -------------------------------------------------------
  # Job 4 - Deploy CP Files to Target Environment
  # -------------------------------------------------------
  deploy_cp:
    name: Deploy CP Files to ${{ github.event.inputs.target_environment }}
    runs-on: ubuntu-latest
    needs: [validate, approval]
    environment: ${{ github.event.inputs.target_environment }}
    if: always() && (needs.approval.result == 'success' || github.event.inputs.skip_diff_review == 'true') && (github.event.inputs.deploy_cp_bissell == 'true' || github.event.inputs.deploy_cp_bissell_uk == 'true' || github.event.inputs.deploy_cp_bissell_de == 'true')

    env:
      TARGET_URL: ${{ needs.validate.outputs.target_url }}
      TARGET_UK_URL: ${{ needs.validate.outputs.target_uk_url }}
      TARGET_DE_URL: ${{ needs.validate.outputs.target_de_url }}
      SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
      TARGET_BRANCH: ${{ needs.validate.outputs.target_branch }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy CP Files
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.error
          import base64
          import os
          import subprocess

          source_branch = os.environ["SOURCE_BRANCH"]
          target_branch = os.environ["TARGET_BRANCH"]
          target_url = os.environ["TARGET_URL"]
          target_uk_url = os.environ["TARGET_UK_URL"]
          target_de_url = os.environ["TARGET_DE_URL"]

          username = "${{ secrets.B2C_CP_LOGIN_USER }}"
          password = "${{ secrets.B2C_CP_LOGIN_PASS }}"
          credentials = base64.b64encode(f"{username}:{password}".encode()).decode()

          interface_urls = {}
          if "${{ github.event.inputs.deploy_cp_bissell }}" == "true":
            interface_urls["bissell"] = target_url
          if "${{ github.event.inputs.deploy_cp_bissell_uk }}" == "true":
            interface_urls["bissell_uk"] = target_uk_url
          if "${{ github.event.inputs.deploy_cp_bissell_de }}" == "true":
            interface_urls["bissell_de"] = target_de_url

          def webdav_request(url, method, file_path=None):
            if method == "PUT" and file_path:
              with open(file_path, "rb") as f:
                data = f.read()
              req = urllib.request.Request(url, data=data, method="PUT")
              req.add_header("Content-Type", "application/octet-stream")
            else:
              req = urllib.request.Request(url, method=method)
            req.add_header("Authorization", f"Basic {credentials}")
            try:
              with urllib.request.urlopen(req) as resp:
                return resp.status
            except urllib.error.HTTPError as e:
              return e.code

          for interface, webdav_url in interface_urls.items():
            print(f"==========================================")
            print(f"Deploying CP files for: {interface}")
            print(f"Target URL: {webdav_url}")
            print(f"==========================================")

            cp_dir = f"customisations/{interface}/cp_files"
            stats = {"uploaded": 0, "deleted": 0, "skipped": 0, "errors": 0}

            result = subprocess.run(
              ["git", "diff", "--name-status",
               f"origin/{target_branch}", f"origin/{source_branch}",
               "--", cp_dir],
              capture_output=True, text=True
            )

            if not result.stdout.strip():
              print(f"No CP file changes detected for {interface}")
              continue

            changes = result.stdout.strip().split("\n")
            print(f"Found {len(changes)} CP file changes for {interface}")

            for change in changes:
              parts = change.split("\t")
              status = parts[0]
              file_path = parts[1]

              webdav_path = file_path.replace(f"{cp_dir}/", "")
              full_url = f"https://{webdav_url}/{webdav_path}"

              if status == "D":
                print(f"  DELETING: {webdav_path}")
                status_code = webdav_request(full_url, "DELETE")
                if status_code in [200, 204, 404]:
                  print(f"  Successfully deleted: {webdav_path}")
                  stats["deleted"] += 1
                elif status_code == 403:
                  print(f"  WARNING: Skipped (permission denied): {webdav_path}")
                  stats["skipped"] += 1
                else:
                  print(f"  ERROR: Failed to delete {webdav_path} - Status: {status_code}")
                  stats["errors"] += 1
              else:
                action = "ADDING" if status == "A" else "UPDATING"
                print(f"  {action}: {webdav_path}")
                status_code = webdav_request(full_url, "PUT", file_path)
                if status_code in [200, 201, 204]:
                  print(f"  Successfully uploaded: {webdav_path}")
                  stats["uploaded"] += 1
                elif status_code == 403:
                  print(f"  WARNING: Skipped (permission denied): {webdav_path}")
                  stats["skipped"] += 1
                else:
                  print(f"  ERROR: Failed to upload {webdav_path} - Status: {status_code}")
                  stats["errors"] += 1

            print(f"  Uploaded : {stats['uploaded']}")
            print(f"  Deleted  : {stats['deleted']}")
            print(f"  Skipped  : {stats['skipped']} (permission denied)")
            print(f"  Errors   : {stats['errors']}")

            if stats["errors"] > 0:
              print(f"ERROR: {stats['errors']} files failed to deploy.")
              exit(1)

          print("==========================================")
          print("All CP files deployed successfully!")
          print("==========================================")
          PYEOF

      - name: CP Deployment Summary
        run: |
          echo "=========================================="
          echo "CP File Deployment Complete!"
          echo "Target : ${{ github.event.inputs.target_environment }}"
          echo ""
          echo "REMINDER: CP files have been deployed to"
          echo "the Development area only. Promotion from"
          echo "Development to Staging and Production must"
          echo "be done manually through the CP UI."
          echo "=========================================="

  # -------------------------------------------------------
  # Job 5 - Update Target Branch in Git
  # -------------------------------------------------------
  update_branch:
    name: Update Target Branch in Git
    runs-on: ubuntu-latest
    needs: [validate, deploy_cp]
    if: always() && (needs.deploy_cp.result == 'success' || needs.deploy_cp.result == 'skipped')

    env:
      TARGET_BRANCH: ${{ needs.validate.outputs.target_branch }}
      SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
      STORY_LIST: ${{ needs.validate.outputs.story_list }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Source into Target Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git checkout "$TARGET_BRANCH"
          git pull origin "$TARGET_BRANCH"
          git merge "origin/$SOURCE_BRANCH" --no-ff \
            -m "Deploy stories [$STORY_LIST] from ${{ github.event.inputs.source_environment }} to ${{ github.event.inputs.target_environment }} [$(date -u)]"
          git push origin "$TARGET_BRANCH"

          echo "Target branch $TARGET_BRANCH updated successfully."

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Story Deployment Complete!"
          echo "Source    : ${{ github.event.inputs.source_environment }}"
          echo "Target    : ${{ github.event.inputs.target_environment }}"
          echo "Stories   : $STORY_LIST"
          echo "Timestamp : $(date -u)"
          echo ""
          echo "REMINDER: Manually deploy any coded elements"
          echo "(BUI Extensions, Custom Scripts, CPMs) through"
          echo "the B2C interface for this story."
          echo "=========================================="

  # -------------------------------------------------------
  # Job 6 - Rollback (runs only if deploy fails)
  # -------------------------------------------------------
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy_cp, update_branch]
    if: failure()

    steps:
      - name: Notify Rollback Required
        run: |
          echo "=========================================="
          echo "WARNING: Deployment failed!"
          echo "Target Environment : ${{ github.event.inputs.target_environment }}"
          echo ""
          echo "Please review the deployment logs above."
          echo "Manual intervention may be required."
          echo "=========================================="