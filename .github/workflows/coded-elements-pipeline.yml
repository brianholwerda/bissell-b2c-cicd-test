name: Coded Elements Pipeline

on:
  push:
    branches:
      - 'story-ADO-*'
    paths:
      - 'customisations/**/extensions/**'
      - 'customisations/**/scripts/**'
      - 'customisations/**/process_models/**'
  workflow_dispatch:
    inputs:
      story_number:
        description: 'ADO Story Number (e.g. ADO-5542)'
        required: true
        type: string
      interface:
        description: 'Interface Name'
        required: true
        type: choice
        options:
          - bissell
          - bissell_au
          - bissell_de
          - bissell_es
          - bissell_fr
          - bissell_it
          - bissell_nl
          - bissell_pl
          - bissell_pt
          - bissell_se
          - bissell_uk
          - interface_12

jobs:
  # -------------------------------------------------------
  # Job 1 - Code Linting
  # -------------------------------------------------------
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint
        run: npm install eslint eslint-plugin-vue --save-dev --silent

      - name: Create ESLint Config
        run: |
          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "plugins": ["vue"],
            "extends": [
              "eslint:recommended",
              "plugin:vue/vue3-recommended"
            ],
            "parserOptions": {
              "ecmaVersion": "latest",
              "sourceType": "module"
            },
            "rules": {
              "no-unused-vars": "warn",
              "no-console": "warn",
              "eqeqeq": "error",
              "no-eval": "error",
              "no-implied-eval": "error"
            }
          }
          EOF

      - name: Run ESLint on JavaScript and Vue Files
        run: |
          echo "Scanning for JavaScript and Vue files..."

          JS_FILES=$(find customisations -name "*.js" -o -name "*.vue" 2>/dev/null | \
            grep -v node_modules | head -100)

          if [ -z "$JS_FILES" ]; then
            echo "No JavaScript or Vue files found to lint - skipping."
          else
            echo "Files to lint:"
            echo "$JS_FILES"
            npx eslint $JS_FILES --format stylish || {
              echo "ERROR: ESLint found violations. Please fix before merging."
              exit 1
            }
            echo "ESLint passed successfully."
          fi

  # -------------------------------------------------------
  # Job 2 - Unit Tests
  # -------------------------------------------------------
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for Test Files
        id: check_tests
        run: |
          TEST_FILES=$(find customisations -name "*.test.js" -o \
            -name "*.spec.js" 2>/dev/null | grep -v node_modules)

          if [ -n "$TEST_FILES" ]; then
            echo "tests_found=true" >> $GITHUB_OUTPUT
            echo "Test files found:"
            echo "$TEST_FILES"
          else
            echo "tests_found=false" >> $GITHUB_OUTPUT
            echo "=========================================="
            echo "NOTICE: No unit test files found."
            echo "Test files should be named *.test.js or *.spec.js"
            echo "=========================================="
          fi

      - name: Install Jest
        if: steps.check_tests.outputs.tests_found == 'true'
        run: npm install jest @vue/test-utils --save-dev --silent

      - name: Run Unit Tests
        if: steps.check_tests.outputs.tests_found == 'true'
        run: |
          npx jest --coverage || {
            echo "ERROR: Unit tests failed."
            exit 1
          }
          echo "Unit tests passed."

  # -------------------------------------------------------
  # Job 3 - Summary
  # -------------------------------------------------------
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, unit_tests]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "=========================================="
          echo "Coded Elements Pipeline Complete"
          echo "=========================================="
          echo "Lint    : ${{ needs.lint.result }}"
          echo "Tests   : ${{ needs.unit_tests.result }}"
          echo "=========================================="
          echo ""
          echo "REMINDER: Coded elements must be deployed"
          echo "manually through the B2C interface:"
          echo "  - BUI Extensions: Deploy via BUI"
          echo "  - Custom Scripts: Deploy via Element Manager UI"
          echo "  - CPM Scripts: Deploy via Element Manager UI"
          echo "=========================================="