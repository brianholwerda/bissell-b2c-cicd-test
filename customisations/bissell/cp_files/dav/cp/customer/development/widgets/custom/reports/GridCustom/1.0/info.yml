version: "1.0"
requires:
  jsModule:
  - standard
  yui:
  - datatable-base
  - datatable-sort
  - datatable-message
info:
  urlParameters:
    kw:
      name: Keyword
      description: The current search term
      example: kw/search
    r_id:
      name: Report ID
      description: The report ID to apply filters to
      example: r_id/176
    st:
      name: Search Type
      description: Sets the search type to the URL parameter value
      example: st/6
    org:
      name: Organization Type
      description: Sets the organization type to the URL parameter value
      example: org/2
    page:
      name: Page
      description: Sets the select to the page number in the URL parameter
      example: page/2
    search:
      name: Search
      description: Key denoting if search should be performed
      example: search/0
    sort:
      name: Sort By
      description: Sets the sort column to value and direction. Use column number
        and 1 for ascending, 2 for descending
      example: sort/3,1
extends:
  widget: standard/reports/Grid
  components:
  - php
  - view
  - js
  - css
