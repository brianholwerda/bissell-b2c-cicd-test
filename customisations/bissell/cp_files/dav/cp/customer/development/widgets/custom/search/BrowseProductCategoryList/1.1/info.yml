version: "1.0"
requires:
  jsModule:
  - standard
  - mobile
attributes:
  num_to_display:
    name: num_to_display
    type: int
    description: Number of FAQs to display under each heading
    default: 5
    required: false
  num_of_columns:
    name: num_of_columns
    type: int
    description: Number of columns to display.  Default is 1
    default: 1
    required: false
extends:
  widget: standard/search/ProductCategoryList
  components:
  - php
  overrideViewAndLogic: true
