version: "1.0"
requires:
  jsModule:
  - standard
  - mobile
attributes:
  phone_number:
    name: phone_number
    type: string
    description: phone number to be used.
    default: 
    required: false
  place_holder:
    name: place_holder
    type: string
    description: This is place holder in case i need more parameters
    default: Phone #
    required: false
  explanation_msg:
    name: explanation_msg
    type: string
    description: This is the explanation message as to why we need a phone number
    default:  We do not seem to have a phone number on file for your account.  Please provide a phone number so that we can continue. <br/>
    required: true